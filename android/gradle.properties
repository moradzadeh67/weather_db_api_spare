# Gradle JVM arguments for Gradle 9 + JDK 21+.
# --enable-native-access=ALL-UNNAMED is required to silence "Restricted method" 
# warnings from Gradle's internal native-platform library.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED

# Kotlin compiler daemon also needs this flag when running on JDK 21+.
kotlin.daemon.jvmargs=-Xmx4G --enable-native-access=ALL-UNNAMED

# Enable parallel and multiple workers again for better performance,
# now that the flags are also set in the gradlew entry point.
org.gradle.parallel=true
org.gradle.workers.max=4

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false